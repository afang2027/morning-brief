<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morning Brief — </title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #faf9f5;
      --ink: #1a1a1a;
      --accent: #c2567a;
      --muted: #6b6560;
      --border: #e0ddd4;
      --card-bg: #f4f2eb;
    }

    body {
      background: var(--cream);
      color: var(--ink);
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 16px;
      line-height: 1.6;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    /* ── Masthead ── */
    .masthead {
      border-top: 3px solid var(--ink);
      border-bottom: 1px solid var(--ink);
      padding: 20px 0 16px;
      margin: 32px 0 0;
      text-align: center;
    }
    .masthead-kicker {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .masthead-title {
      font-size: 56px;
      font-style: italic;
      font-weight: normal;
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--ink);
    }
    .masthead-title span { color: var(--accent); }
    .masthead-meta {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 10px;
      display: flex;
      justify-content: center;
      gap: 24px;
    }

    /* ── Section headers ── */
    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 48px 0 20px;
    }
    .section-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      white-space: nowrap;
    }
    .section-rule { flex: 1; height: 1px; background: var(--border); }

    /* ── Cover ── */
    .cover {
      border-bottom: 1px solid var(--border);
      padding-bottom: 32px;
      margin-bottom: 8px;
    }
    .cover-headline {
      font-size: 38px;
      font-style: italic;
      font-weight: normal;
      line-height: 1.15;
      letter-spacing: -0.01em;
      color: var(--ink);
      margin-bottom: 16px;
    }
    .cover-stand {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: var(--muted);
      max-width: 640px;
    }

    /* ── Markets ── */
    .markets-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    .stock-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      text-decoration: none;
      display: block;
      transition: border-color 0.15s;
    }
    .stock-card:hover { border-color: var(--accent); }
    .stock-card-header {
      padding: 10px 12px 4px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .stock-ticker {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--ink);
    }
    .stock-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      color: var(--muted);
    }
    .stock-chart { width: 100%; height: 120px; border: none; display: block; }

    /* ── News lead ── */
    .news-lead {
      border-bottom: 1px solid var(--border);
      padding-bottom: 28px;
      margin-bottom: 24px;
    }
    .news-lead-source {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }
    .news-lead-title {
      font-size: 28px;
      font-style: italic;
      font-weight: normal;
      line-height: 1.25;
      color: var(--ink);
      text-decoration: none;
      display: block;
      margin-bottom: 12px;
    }
    .news-lead-title:hover { color: var(--accent); }
    .news-lead-summary {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 14px;
      line-height: 1.6;
      color: var(--muted);
    }

    /* ── News grid ── */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }
    .news-card { border-top: 2px solid var(--border); padding-top: 16px; }
    .news-card-source {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .news-card-title {
      font-size: 16px;
      font-style: italic;
      line-height: 1.3;
      color: var(--ink);
      text-decoration: none;
      display: block;
      margin-bottom: 8px;
    }
    .news-card-title:hover { color: var(--accent); }
    .news-card-summary {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 12px;
      line-height: 1.5;
      color: var(--muted);
    }

    /* ── Social ── */
    .social-sentiment {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .social-pullquote {
      border-left: 3px solid var(--accent);
      padding: 4px 0 4px 20px;
      font-size: 22px;
      font-style: italic;
      line-height: 1.4;
      color: var(--ink);
      margin-bottom: 28px;
    }
    .social-threads { display: flex; flex-direction: column; gap: 16px; }
    .thread-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
    }
    .thread-meta {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 8px;
      display: flex;
      gap: 12px;
    }
    .thread-platform {
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .thread-title {
      font-size: 15px;
      line-height: 1.4;
      color: var(--ink);
      text-decoration: none;
      display: block;
      margin-bottom: 6px;
    }
    .thread-title:hover { color: var(--accent); }
    .thread-summary {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 12px;
      line-height: 1.5;
      color: var(--muted);
    }

    /* ── Art ── */
    .art-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    .art-card img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      border-radius: 4px;
      display: block;
      margin-bottom: 12px;
    }
    .art-title { font-size: 15px; font-style: italic; color: var(--ink); margin-bottom: 4px; }
    .art-artist {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .art-date {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .art-medium {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      font-style: italic;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .art-note {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 12px;
      line-height: 1.55;
      color: var(--muted);
    }

    /* ── Substack ── */
    .substack-list { display: flex; flex-direction: column; gap: 0; }
    .newsletter-card {
      border-top: 1px solid var(--border);
      padding: 16px 0;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
    }
    .newsletter-sender {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .newsletter-title {
      font-size: 16px;
      font-style: italic;
      color: var(--ink);
      text-decoration: none;
      display: block;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .newsletter-title:hover { color: var(--accent); }
    .newsletter-summary {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 12px;
      line-height: 1.5;
      color: var(--muted);
    }
    .newsletter-date {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ── Podcasts ── */
    .podcast-list { display: flex; flex-direction: column; gap: 16px; }
    .podcast-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 16px;
      align-items: start;
    }
    .podcast-icon {
      width: 48px;
      height: 48px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .podcast-icon svg { width: 20px; height: 20px; fill: white; }
    .podcast-show {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .podcast-title {
      font-size: 15px;
      font-style: italic;
      color: var(--ink);
      text-decoration: none;
      display: block;
      margin-bottom: 4px;
      line-height: 1.3;
    }
    .podcast-title:hover { color: var(--accent); }
    .podcast-meta {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .podcast-summary {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 12px;
      line-height: 1.5;
      color: var(--muted);
    }

    /* ── News card extras ── */
    .news-card-take {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 11px;
      line-height: 1.5;
      color: var(--accent);
      margin-top: 6px;
    }
    .news-card-angle {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 11px;
      line-height: 1.5;
      color: var(--muted);
      font-style: italic;
      margin-top: 4px;
    }

    /* ── Newsletter card extras ── */
    .newsletter-insight {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 12px;
      line-height: 1.5;
      color: var(--accent);
      margin-top: 6px;
    }
    .newsletter-angle {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 11px;
      line-height: 1.5;
      color: var(--muted);
      font-style: italic;
      margin-top: 4px;
    }

    /* ── Podcast key moments ── */
    .podcast-moments {
      list-style: none;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .podcast-moments li {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
    }
    .moment-time {
      font-weight: 600;
      color: var(--accent);
      margin-right: 6px;
      font-variant-numeric: tabular-nums;
    }

    /* ── Colophon ── */
    .colophon {
      border-top: 1px solid var(--border);
      margin-top: 64px;
      padding-top: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
    }
    .colophon-left { display: flex; flex-direction: column; gap: 4px; }
    .colophon-brand { font-style: italic; font-family: Georgia, serif; font-size: 13px; color: var(--ink); }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      body { padding: 0 16px 60px; }
      .masthead-title { font-size: 36px; }
      .cover-headline { font-size: 26px; }
      .art-grid { grid-template-columns: 1fr; }
      .markets-strip { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
      .newsletter-card { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- ══ MASTHEAD ══ -->
  <header class="masthead">
    <div class="masthead-kicker">Your personal daily intelligence</div>
    <div class="masthead-title">Morning <span>Brief</span></div>

  <section class="cover">

</body>
</html>
